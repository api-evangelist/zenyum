aid: zenyum
name: Zenyum
description: >-
  Zenyum is a Singapore-founded, direct-to-consumer oral-care and dental
  company operating across Asia. Its flagship product is ZenyumClear invisible
  braces (clear aligners) delivered through a network of partner clinics,
  alongside a broader oral-care line that includes ZenyumSonic electric
  toothbrushes, ZenyumBright whitening strips, serums and pens, toothpastes,
  water flossers and floss. Zenyum sells online and through retail across
  Singapore, Hong Kong, Taiwan, Malaysia, Indonesia, Thailand, Vietnam and
  Japan, and is backed by venture investors including Partech. As of this
  profile the company operates consumer e-commerce and clinic-partner surfaces
  but publishes no public developer portal, API documentation, or GitHub
  organization; this record captures its verifiable public web and domain
  security footprint.
